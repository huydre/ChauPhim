version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: chauphim_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_DATABASE: chauphim
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - chauphim_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chauphim_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chauphim_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: chauphim_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - chauphim_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chauphim_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:@mysql:3306/chauphim
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: vod
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_USE_SSL: false
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_change_in_production
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - redis
      - minio
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - chauphim_network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  chauphim_network:
    driver: bridge
